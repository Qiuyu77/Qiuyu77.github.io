# 导入主题
theme: jekyll-theme-chirpy

# 网页语言 › http://www.lingoes.net/en/translator/langcode.htm
# 如果它与 _data/locales 中的某个文件名相同，布局语言也会随之改变，
# 否则，布局语言将使用默认值 'en'。
lang: zn-ch

# 设置你的时区 › https://zones.arilyn.cc
timezone:

# jekyll-seo-tag 设置 › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
# ↓ --------------------------

title: Qiuyublogs # 网站主标题

tagline: 我的博客test # 将显示为副标题

description: >- # 用于 SEO 元数据和 Atom Feed
  桂林电子科技大学计算机科学与技术专业本科生，专注于算法、机器学习、深度学习与计算机视觉，
  热爱数学建模、Python 开发与 Web 技术，持续学习并探索人工智能领域。

# 填写协议和主机名。
# 例如：'https://username.github.io'，末尾不要添加 '/'。
url: ""

github:
  username: Qiuyu77 # 修改为你的 GitHub 用户名

twitter:
  username: Yuirariyuu # 修改为你的 Twitter 用户名

social:
  # 修改为你的姓名。
  # 它将作为文章的默认作者以及页脚中的版权归属者显示
  name: qiuyu
  email: 3384138035@qq.com # 修改为你的邮箱地址
  fediverse_handle: # 填写你的 Fediverse 账号，例如："@username@domain.com"
  links:
    # 第一个元素将作为版权归属者的链接
    - https://twitter.com/Yuirariyuu # 修改为你的 Twitter 主页
    - https://github.com/qiuyu77 # 修改为你的 GitHub 主页
    # 取消下面的注释即可添加更多社交链接
    # - https://www.facebook.com/username
    # - https://www.linkedin.com/in/username

# 网站验证设置
webmaster_verifications:
  google: # 填写你的 Google 验证码
  bing: # 填写你的 Bing 验证码
  alexa: # 填写你的 Alexa 验证码
  yandex: # 填写你的 Yandex 验证码
  baidu: # 填写你的百度验证码
  facebook: # 填写你的 Facebook 验证码

# ↑ --------------------------
# jekyll-seo-tag 设置结束

# 网站数据统计设置
analytics:
  google:
    id:
  goatcounter:
    id: qiuyu77
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

# 页面访问量设置
pageviews:
  provider: goatcounter

# 首选配色方案设置
#
# 注意：留空将默认跟随系统配色，
# 同时在侧边栏左下角显示深色/浅色主题切换按钮。
#
# 可选值：
#
#     light — 浅色模式
#     dark — 深色模式
#
theme_mode: # [light | dark]

# 媒体资源的 CDN 地址。
# 注意：设置后，所有以 '/' 开头的媒体资源路径
# （包括网站头像、文章图片、音频和视频）都会添加 CDN 地址。
#
# 例如：
# 'https://cdn.com'
cdn:

# 侧边栏头像，支持本地资源或 CORS 资源
avatar:/assets/img/avatar.jpg

# 网站全局社交分享预览图片的 URL，用于 SEO 的 og:image。
# 可以通过文章 front matter 中的 page.image 覆盖。
social_preview_image: /assets/img/avatar.jpg # 字符串，本地资源或 CORS 资源

# 是否全局启用文章目录 TOC
toc: true

actions:
  # 在每篇文章页面显示“编辑此文章”操作，以鼓励用户参与贡献。
  edit_post:
    enabled: false # 设置为 true 以显示“编辑此文章”操作。
    url: "" # 仓库基础 URL，例如：https://github.com/cotes2020/jekyll-theme-chirpy/edit/master
    # 使用动态 URL 或静态 URL。
    # 如果 static_url 为 false，文章路径将追加到上面的 url 末尾。
    # 设置为 true 后，所有文章都使用相同的 URL。
    static_url: false # [ true | false ]

comments:
  # 全局评论系统开关。留空表示禁用。
  provider: giscus
  # 以下为各评论系统的配置选项。
  disqus:
    shortname: # 填写 Disqus shortname › https://help.disqus.com/en/articles/1717111-how-to-get-a-shortname

  # utterances 设置 › https://utteranc.es/
  utterances:
    repo: # <GitHub用户名>/<仓库名>
    issue_term: # < url | pathname | title | ...>

  # Giscus 设置 › https://giscus.app
  giscus:
    repo: qiuyu77/qiuyu77.github.io
    repo_id: R_kgDOU7evcw
    category: Announcements
    category_id: DIC_kwDOU7evc84DHCPq
    mapping: pathname
    strict: 0
    input_position: bottom
    lang: zh-CN
    reactions_enabled: 1

# 自托管静态资源，可选 › https://github.com/cotes2020/chirpy-static-assets
assets:
  self_host:
    enabled: # 布尔值，留空表示 false
    # 指定 Jekyll 环境，留空表示同时适用于 development 和 production
    # 仅当 assets.self_host.enabled 为 true 时生效
    env: # [development | production]

pwa:
  enabled: true # 启用 PWA 功能（可安装）
  cache:
    enabled: true # 启用 PWA 离线缓存
    # 以下路径将被排除在 PWA 缓存之外。
    # 通常用于与当前网站共享同一域名的其他网站的 baseurl。
    deny_paths:
      # - "/example"  # 与 <SITE_URL>/example/* 匹配的 URL 不会被缓存

paginate: 10

# 网站的基础 URL
baseurl: ""

# ------------ 以下选项不建议修改 ----------------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts: # Rouge 代码高亮设置
    css_class: highlight
    # default_lang: console
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: "" # 空字符串表示项目中的所有文件
      type: posts
    values:
      layout: post
      comments: true # 启用文章评论。
      toc: true # 启用文章目录。
      # 除非你有把握同时修改项目中所有其他文章链接，否则不要修改以下参数。
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs # 使用 site.collections 中的 tabs 集合
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/