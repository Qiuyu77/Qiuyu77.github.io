# 站点配置

# 导入主题
theme: jekyll-theme-chirpy

# 网页语言
lang: zn-ch

# 时区
timezone: Asia/Shanghai

# jekyll-seo-tag 设置
title: Qiuyu^blogs # 主标题

tagline: 我的博客 # 副标题

description: >- # 用于 SEO meta 和 atom feed
  邱宇的个人博客，记录学习与成长。

# 站点地址
url: "https://Qiuyu77.github.io"

github:
  username: Qiuyu77 # 你的 GitHub 用户名

twitter:
  username: Yuirariyuu # 你的 Twitter 用户名

social:
  name: 邱宇 # 你的全名
  email: 3384138035@qq.com # 你的邮箱
  fediverse_handle:
  links:
    - https://github.com/Qiuyu77   # 第一个链接作为版权所有者链接
    - https://twitter.com/Yuirariyuu # 你的 Twitter 主页

# 站点验证设置（留空即可）
webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# Web 分析设置（留空即可）
analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

# 页面浏览量设置
pageviews:
  provider:

# 配色方案：可留空跟随系统，或填 light / dark
theme_mode: dark

# CDN 端点（留空）
cdn:

# 侧边栏头像，上传图片到 assets/img/avatar.jpg 后填写路径
avatar: /assets/img/avatar.jpg

# 社交预览图片（留空）
social_preview_image:

# 文章目录开关
toc: true

# 编辑文章操作（默认关闭）
actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

# 评论系统（默认禁用，可后续配置）
comments:
  provider:
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position:
    lang:
    reactions_enabled:

# 自托管静态资源（默认关闭）
assets:
  self_host:
    enabled:
    env:

# PWA 设置
pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

# 分页数量
paginate: 10

# 站点 base URL（留空）
baseurl: ""

# ------------ 以下选项不建议修改 ------------------
kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/